        /* === CSS STYLES === */
        :root {

            --bg-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.1);
            --border-glow: rgba(255, 255, 255, 0.25);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --text-dim: #666666;
            --accent-glow: rgba(255, 255, 255, 0.8);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {

            color: var(--text-main);
            font-family: var(--font-family);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Canvas Particle Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Utility Classes */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
        }

        .glow-text {
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .section-title {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 48px;
            position: relative;
            font-weight: 800;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: var(--text-main);
            margin: 12px auto 0;
            box-shadow: 0 0 8px var(--text-main);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            transition: all 0.3s var(--transition-smooth);
            cursor: pointer;
            gap: 10px;
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn svg {
            fill: currentColor;
            width: 18px;
            height: 18px;
        }

        /* SVG Icon Utilities */
        .icon-svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Dynamic 3D Card Base */
        .card-3d {
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, border-color 0.3s ease, box-shadow 0.3s ease;
            will-change: transform;
        }

        /* Floating Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        /* Scroll Reveal Effect Base */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease, transform 0.8s var(--transition-smooth);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- LOADING SCREEN --- */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .spinner-ring {
            width: 80px;
            height: 80px;
            border: 2px solid transparent;
            border-top: 2px solid #ffffff;
            border-right: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-title {
            font-size: 1.5rem;
            letter-spacing: 6px;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);

            color: var(--text-main);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;

            background: #ffffff;
